<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waste Management Tycoon | Classroom</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2e9;color:#183b30;font:16px system-ui}header{background:#183e33;color:white;padding:24px max(5%,calc((100% - 1100px)/2));}header small{letter-spacing:2px}h1{margin:8px 0;font-size:clamp(24px,4vw,40px)}main{max-width:1100px;margin:auto;padding:24px 16px}section{background:white;border:1px solid #d4dfd4;border-radius:15px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;border-radius:8px;padding:12px;border:1px solid #b6c8bd}button{background:#246c53;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.alt{background:white;color:#246c53}input{width:100%;margin:6px 0 12px}select{display:block;width:100%;margin:6px 0 12px}h2,h3{margin:0 0 10px}p{line-height:1.5}small{color:inherit;opacity:.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{border:1px solid #ccd9cf;border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:8px}.tile button{margin-top:auto}.selected{border:2px solid #24744f;background:#e0f3e4}.owned{background:#f0f4ef}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f2f6f1;padding:12px;border-radius:9px}.stat strong{display:block;font-size:clamp(17px,3vw,29px)}.city{display:flex;gap:10px;flex-wrap:wrap;background:#d9e9d4;padding:15px;border-radius:10px}.city span{font-size:29px;text-align:center;min-width:75px;flex:1}.city small{display:block;font-size:11px}.empty{opacity:.25}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #dde5dd}#error{color:#a73325;min-height:22px}#feedback{background:#fff1cc;padding:12px;border-radius:8px}.pin{font-size:48px;letter-spacing:8px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}.question button{display:block;width:100%;text-align:left;margin:8px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase} @media(max-width:550px){.stats{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}
</style><header><small>YEAR 9 SCIENCE · CLASSROOM EDITION · V4</small><h1>Waste Management Tycoon</h1>Build your city. Protect your future.</header><main><div id="error" role="status"></div><div id="app"></div></main><script>
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null,st=null,pick=[],busy=false,polling=false,last='';try{session=JSON.parse(sessionStorage.getItem('tycoon'))}catch{};
async function api(op,more={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...session,...more})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function showError(e){$('error').textContent=e.message||String(e)}
async function act(op,more={}){if(busy)return;busy=true;$('error').textContent='';try{let d=await api(op,more);if(op==='create'||op==='join'){session=d;sessionStorage.setItem('tycoon',JSON.stringify(d));d=await api('state')}if(op==='invest')pick=[];update(d)}catch(e){showError(e)}finally{busy=false}}
function update(d){if(st?.year!==d.year)pick=[];st=d;let sig=JSON.stringify(d);if(sig!==last){last=sig;render()}}
function leave(){sessionStorage.removeItem('tycoon');session=null;st=null;last='';pick=[];render()}
function toggle(i){let a=st.assets,p=pick.includes(i)?pick.filter(x=>x!==i):[...pick,i];if(p.length<=2&&p.reduce((s,k)=>s+a[k].cost,0)<=Math.max(0,st.me.cash)){pick=p;render()}}
function leaderboard(){return `<section><h2>${st.phase==='finished'?'Final leaderboard':'Class leaderboard'}</h2><table><thead><tr><th>Rank / City</th><th>Cash</th><th>Eco</th><th>Health</th><th>Score</th><th>Status</th></tr></thead><tbody>${st.teams.map((t,i)=>`<tr><td>${i+1}. ${esc(t.name)}</td><td>$${t.cash}M</td><td>${t.ep}</td><td>${t.hp}</td><td><b>${t.score}</b></td><td>${st.phase==='finished'?(t.eligible?'Eligible':'Debt'):{choose:'Investing',quiz:'Science',done:'Ready',waiting:'Joined'}[t.phase]}</td></tr>`).join('')}</tbody></table></section>`}
const kinds=['Metal','Plastic','Tyres','Organic'];let draft={to:'',kind:'0',amount:'10',price:'0'};
function market(t){let others=st.market.filter(x=>x.name!==t.name&&x.phase==='choose');return `<section><h2>Resource exchange</h2><p>Trade waste before running your city. Positive price = buyer pays seller; negative price = seller pays buyer to take waste. All prices in $M.</p><div class="stats">${kinds.map((k,i)=>`<div class="stat"><small>${k}</small><strong>${t.w[i]}</strong></div>`).join('')}</div><h3>Available partners</h3>${others.map(x=>`<p><b>${esc(x.name)}</b> · ${x.w.map((n,i)=>kinds[i]+': '+n).join(' / ')}<br>Facilities: ${x.owned.filter(i=>!x.damaged.includes(i)).map(i=>st.assets[i].n).join(', ')||'None'}</p>`).join('')||'<p>No other city is trading.</p>'}<div class="grid"><label>Send to<select id="to" onchange="draft.to=this.value"> <option value="">Select city</option>${others.map(x=>`<option ${draft.to===x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select></label><label>Resource<select id="kind" onchange="draft.kind=this.value">${kinds.map((k,i)=>`<option value="${i}" ${draft.kind==i?'selected':''}>${k}</option>`).join('')}</select></label><label>Units<input type="number" value="${esc(draft.amount)}" oninput="draft.amount=this.value"></label><label>Total price ($M)<input type="number" value="${esc(draft.price)}" oninput="draft.price=this.value"></label></div><button onclick="act('offer',{year:st.year,to:draft.to,kind:+draft.kind,amount:+draft.amount,price:+draft.price})">Send offer</button><h3>Trade offers</h3>${st.offers.map(o=>`<p>${esc(o.from)} → ${esc(o.to)}: ${o.n} ${kinds[o.k]} · $${o.price}M · ${o.status} ${o.status==='open'?`<button class="alt" onclick="act('respond',{year:st.year,id:'${o.id}',accept:false})">${o.from===t.name?'Cancel':'Decline'}</button> ${o.to===t.name?`<button onclick="act('respond',{year:st.year,id:'${o.id}',accept:true})">Accept</button>`:''}`:''}</p>`).join('')||'<p>No offers yet.</p>'}</section><section><h2>Maintenance & pollution control</h2><p>Uncontrolled operating industrial buildings pay $2M each in year 1 and $4M each thereafter. A clean retrofit costs $10M and reduces health risk as well as avoiding this simulated fine. Damaged buildings cannot operate until repaired ($12M).</p>${t.owned.filter(i=>i>=2&&i<=5).map(i=>`<p><b>${st.assets[i].n}</b> ${t.damaged.includes(i)?`<button onclick="act('repair',{year:st.year,i:${i}})">Repair $12M</button>`:' · Operational'} ${!t.clean.includes(i)?`<button class="alt" onclick="act('clean',{year:st.year,i:${i}})">Clean retrofit $10M</button>`:' · Clean retrofit installed'}</p>`).join('')||'<p>No industrial buildings yet.</p>'}</section>`}
function render(){let a=$('app');if(!session){a.innerHTML=`<div class="grid"><section><h2>Teacher</h2><p>Create a classroom room and share the PIN.</p><button onclick="act('create')">Host game</button></section><section><h2>Students</h2><label>Room PIN<input id="pin" inputmode="numeric" maxlength="6" placeholder="6 digits"></label><label>City name<input id="name" maxlength="32" placeholder="Your team name"></label><button onclick="act('join',{pin:$('pin').value.trim(),name:$('name').value})">Join game</button></section></div>`;return}if(!st){a.textContent='Connecting to your room…';return}let top=`<section><div class="actions"><b>ROOM ${st.pin} · ${st.host?'TEACHER':'STUDENT'}</b><button class="alt" onclick="if(confirm('Leave this session?'))leave()">Leave</button></div><h2>${st.phase==='lobby'?'Waiting lobby':st.phase==='finished'?'Game complete':'Year '+st.year+' of 5'}</h2></section>`,news=st.event?`<section><div class="tag">City news</div><h2>${st.event.t}</h2><p>${st.event.d}</p><small>${st.event.q}</small></section>`:'';if(st.host){let ready=st.teams.filter(t=>t.phase==='done').length;a.innerHTML=top+(st.phase==='lobby'?`<section><div class="tag">Join PIN</div><div class="pin">${st.pin}</div><p>${st.teams.length} cities connected. Students use this same website on their devices.</p><button ${st.teams.length?'':'disabled'} onclick="act('start')">Start game</button></section>`:st.phase==='playing'?news+`<section><h2>${ready} / ${st.teams.length} teams ready</h2><div class="actions"><button ${ready===st.teams.length?'':'disabled'} onclick="act('advance')">${st.year===5?'Reveal final results':'Start next year'}</button><button class="alt" onclick="if(confirm('End incomplete turns without further rewards?'))act('force')">Close incomplete turns</button></div></section>`:`<section><h2>Champion: ${esc(st.teams.find(t=>t.eligible)?.name||'No eligible city')}</h2><p>Discuss how the winning city balanced the 3Rs, economics and public health.</p></section>`)+leaderboard();return}let t=st.me;if(st.phase==='lobby'){a.innerHTML=top+`<section><h2>${esc(t.name)} is ready!</h2><p>Your teacher will start the game. Starting capital: $100M.</p></section>`;return}let stats=`<section><h2>${esc(t.name)}</h2><div class="stats">${[['Cash','$'+t.cash+'M'],['Sustainability',t.ep],['Public health',t.hp+'/100'],['Science',t.science+'/75']].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><h3 style="margin-top:16px">Your city</h3><div class="city">${st.assets.map((x,i)=>`<span class="${t.owned.includes(i)?'':'empty'}">${x.icon}<small>${x.n}${t.damaged?.includes(i)?' · DAMAGED':t.clean?.includes(i)?' · CLEAN':''}</small></span>`).join('')}</div></section>`;let content='';if(st.phase==='finished'){content=`<section><h2>Final city score: ${st.teams.find(x=>x.name===t.name).score}</h2><p>${t.cash<0?'Outstanding debt: not eligible for championship.':'Eligible for championship.'} Total landfill: ${t.history.reduce((s,h)=>s+h.land,0)} units.</p><h3>Criterion D reflection</h3><p>Describe one technology used. Discuss an environmental benefit and a health risk. Explain how your city applied the 3Rs.</p><button onclick="window.print()">Print report</button></section>`+leaderboard()}else if(t.phase==='choose'){let cost=pick.reduce((s,i)=>s+st.assets[i].cost,0);content=market(t)+`<section><h2>Choose up to two investments</h2><p>Selected: ${pick.length}/2 · Remaining after purchase: $${Math.round((t.cash-cost)*10)/10}M</p><div class="grid">${st.assets.map((x,i)=>`<div class="tile ${t.owned.includes(i)?'owned':pick.includes(i)?'selected':''}"><small>${x.kind}</small><h3>${x.icon} ${x.n}</h3><b>$${x.cost}M</b><p>${x.desc}</p><small>${x.cap}</small><button ${t.owned.includes(i)||(!pick.includes(i)&&(pick.length===2||cost+x.cost>t.cash))?'disabled':''} onclick="toggle(${i})">${t.owned.includes(i)?'Owned':pick.includes(i)?'Remove':'Invest'}</button></div>`).join('')}</div><p><button onclick="act('invest',{year:st.year,pick})">Run city &amp; lock investments</button></p></section>`}else{let h=t.history.at(-1);content=`<section><h2>Year results</h2><p>Managed ${h.managed} units · Landfill ${h.land} units · Revenue $${h.rev}M · Sustainability ${h.ep>=0?'+':''}${h.ep} · Health loss ${h.loss} · Pollution fine $${h.fine}M</p></section>`+(t.feedback?`<section id="feedback">${esc(t.feedback.text)}</section>`:'');if(t.phase==='quiz'){let q=t.question;content+=`<section class="question"><div class="tag">${q.crisis?'Science crisis · wrong answer costs 10 health':'Science challenge · first correct +5 points and $5M; retry +2 points'}</div><h2>Question ${t.q+1} of 3</h2><p>${q.text}</p>${q.options.map((x,i)=>`<button class="alt" onclick="act('answer',{year:st.year,q:${t.q},attempt:${t.attempt},choice:${i}})">${x}</button>`).join('')}</section>`}else content+=`<section><h2>Ready for the next step</h2><p>Wait for your teacher. Discuss which investment you would make next and why.</p></section>`}a.innerHTML=top+stats+news+content;}
render();async function refresh(){if(session&&!busy&&!polling){polling=true;try{let d=await api('state');if(!busy&&session)update(d)}catch(e){showError(e)}finally{polling=false}}}refresh();setInterval(refresh,1500);
</script></html>
