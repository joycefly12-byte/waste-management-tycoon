none;background:transparent}.tile{padding:18px;border-radius:14px;background:#fbfcf9}.tile h3{font-size:19px}.tile small:first-child,.tag{font-size:11px;letter-spacing:1.4px;font-weight:800;color:#087d68}.tile.owned{background:#e8f3e8}.tile.selected{outline:2px solid #087d68;border:1px solid #087d68}.pin{color:#087d68;font-size:clamp(36px,7vw,70px)}.reading{background:#eef5ed;border-left:4px solid #087d68;padding:18px;border-radius:8px;line-height:1.7}.level{display:inline-block;background:#e6f0d9;color:#355e27;font-size:12px;font-weight:800;border-radius:20px;padding:4px 10px}.upgrade-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e0e8df}.upgrade-row b{flex:1}.upgrade-form{border:1px solid #b6d6c4;border-radius:14px;padding:20px;margin-top:14px}.upgrade-form label{display:block;margin-top:14px}.review{padding:16px;border:1px solid #d4e4d9;border-radius:12px;margin-top:12px}.review p{white-space:pre-wrap;overflow-wrap:anywhere}table th{font-size:12px;color:#4a7165;text-transform:uppercase}tbody tr:nth-child(odd){background:#f4f8f2}#feedback{background:#fff3d7}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d9ad4e;outline-offset:2px}@media(max-width:600px){section{padding:15px}.city span{min-width:80px}.stat{padding:10px}header{padding-left:20px}}

:root{--ink:#182f43;--accent:#087d68;--paper:#f0f5fa}body{background:#f0f5fa;color:var(--ink)}header{background:#142d43;border:0;padding:20px max(5%,calc((100% - 1240px)/2));}header:after{display:none}header h1{font-size:clamp(22px,3vw,32px)}.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center;background:#142d43;color:#fff;padding:32px;border:0;overflow:hidden}.hero h2{font-size:clamp(34px,5vw,64px);line-height:1.02;letter-spacing:-2px;margin:12px 0}.hero p{color:#c9e2ed;max-width:42ch}.hero .tag{color:#9ff2c3}.hero svg{width:100%;height:auto}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.steps div{background:white;border-radius:16px;padding:18px;border:1px solid #dce7ef}.steps b{display:block;margin:8px 0}.steps strong{font-size:24px;color:#087d68}.join-grid{grid-template-columns:1fr 1fr}.join-grid section{border-top:5px solid #087d68}.join-grid button{width:100%}.city{background:linear-gradient(#c4e8f9 0 60%,#9bd1a2 60%);gap:8px}.city span{font-size:16px;min-width:110px;background:#ffffffa8;box-shadow:0 5px 0 #659b77}.city svg{display:block;width:100%;max-width:95px;margin:auto}.city small{font-size:11px;font-weight:700}.tile{box-shadow:0 3px 0 #dce5e9;border-color:#dce5e9}.tile h3{color:#213b53}.tile p{font-size:14px}.tile small{color:#527181}.stat:nth-child(2){background:#e3f5df}.stat:nth-child(3){background:#ffebdf}.stat:nth-child(4){background:#eae8ff}.question{border-top:6px solid #7966c9}.briefing{background:#eaf5ff;border-left:5px solid #528ac5;padding:18px;border-radius:12px;margin:12px 0}.briefing a{color:#164e82;font-size:14px}.question button.alt{background:#fff;border:1px solid #ccd9e8;color:#182f43}.question button.alt:hover{background:#e3f3ff}.tag{color:#126b55}.reading{background:#ecf4ff;border-color:#7966c9}.progress{display:flex;gap:6px;margin:10px 0}.progress span{height:7px;flex:1;border-radius:8px;background:#dce6ed}.progress .done{background:#15936d}.mission{font-size:13px;letter-spacing:.07em;font-weight:800;color:#42647a}.art{height:88px;background:linear-gradient(#d7effa 65%,#c0e0b0 65%);border-radius:10px;overflow:hidden;text-align:center}.art svg{height:88px;width:110px}.tile.owned .art{background:linear-gradient(#c3e7f7 65%,#a5d5a5 65%)}@media(max-width:700px){.hero,.join-grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.hero{padding:22px}.hero svg{max-height:230px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><header><small>YEAR 9 SCIENCE · SUSTAINABLE FUTURES · V6</small><h1>Waste Management Tycoon</h1>Build smarter. Trade resources. Protect your future.</header><main><div id="error" role="status"></div><div id="app"></div></main><script>
const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null,st=null,pick=[],busy=false,polling=false,last='';try{session=JSON.parse(sessionStorage.getItem('tycoon'))}catch{};
async function api(op,more={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...session,...more})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function showError(e){$('error').textContent=e.message||String(e)}
async function act(op,more={}){if(busy)return;busy=true;$('error').textContent='';try{let d=await api(op,more);if(op==='create'||op==='join'){session=d;sessionStorage.setItem('tycoon',JSON.stringify(d));d=await api('state')}if(op==='invest')pick=[];update(d)}catch(e){showError(e)}finally{busy=false}}
function update(d){if(st?.year!==d.year){pick=[];upgradeId=null;upgradeDraft={a:['',''],text:''}};st=d;let sig=JSON.stringify(d);if(sig!==last){last=sig;const focused=document.activeElement;const id=focused?.id;const start=focused?.selectionStart,end=focused?.selectionEnd;render();if(id){const el=$(id);if(el){el.focus();if(typeof start==='number'&&el.setSelectionRange)try{el.setSelectionRange(start,end)}catch{}}}}}
function leave(){sessionStorage.removeItem('tycoon');session=null;st=null;last='';pick=[];render()}
function toggle(i){let a=st.assets,p=pick.includes(i)?pick.filter(x=>x!==i):[...pick,i];if(p.length<=2&&p.reduce((s,k)=>s+a[k].cost,0)<=Math.max(0,st.me.cash)){pick=p;render()}}
function leaderboard(){return `<section><h2>${st.phase==='finished'?'Final leaderboard':'Class leaderboard'}</h2><table><thead><tr><th>Rank / City</th><th>Cash</th><th>Eco</th><th>Health</th><th>Score</th><th>Status</th></tr></thead><tbody>${st.teams.map((t,i)=>`<tr><td>${i+1}. ${esc(t.name)}</td><td>$${t.cash}M</td><td>${t.ep}</td><td>${t.hp}</td><td><b>${t.score}</b></td><td>${st.phase==='finished'?(t.eligible?'Eligible':'Debt'):{choose:'Investing',quiz:'Science',done:'Ready',waiting:'Joined'}[t.phase]}</td></tr>`).join('')}</tbody></table></section>`}
const kinds=['Metal','Plastic','Tyres','Organic'];let upgradeId=null,upgradeDraft={a:['',''],text:''};let draft={to:'',kind:'0',amount:'10',price:'0'};
function market(t){let others=st.market.filter(x=>x.name!==t.name&&x.phase==='choose');return `<section><h2>Resource exchange</h2><p>Trade waste before running your city. Positive price = buyer pays seller; negative price = seller pays buyer to take waste. All prices in $M.</p><div class="stats">${kinds.map((k,i)=>`<div class="stat"><small>${k}</small><strong>${t.w[i]}</strong></div>`).join('')}</div><h3>Available partners</h3>${others.map(x=>`<p><b>${esc(x.name)}</b> · ${x.w.map((n,i)=>kinds[i]+': '+n).join(' / ')}<br>Facilities: ${x.owned.filter(i=>!x.damaged.includes(i)).map(i=>st.assets[i].n).join(', ')||'None'}</p>`).join('')||'<p>No other city is trading.</p>'}<div class="grid"><label>Send to<select id="to" onchange="draft.to=this.value"> <option value="">Select city</option>${others.map(x=>`<option ${draft.to===x.name?'selected':''} value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select></label><label>Resource<select id="kind" onchange="draft.kind=this.value">${kinds.map((k,i)=>`<option value="${i}" ${draft.kind==i?'selected':''}>${k}</option>`).join('')}</select></label><label>Units<input type="number" value="${esc(draft.amount)}" oninput="draft.amount=this.value"></label><label>Total price ($M)<input type="number" value="${esc(draft.price)}" oninput="draft.price=this.value"></label></div><button onclick="act('offer',{year:st.year,to:draft.to,kind:+draft.kind,amount:+draft.amount,price:+draft.price})">Send offer</button><h3>Trade offers</h3>${st.offers.map(o=>`<p>${esc(o.from)} → ${esc(o.to)}: ${o.n} ${kinds[o.k]} · $${o.price}M · ${o.status} ${o.status==='open'?`<button class="alt" onclick="act('respond',{year:st.year,id:'${o.id}',accept:false})">${o.from===t.name?'Cancel':'Decline'}</button> ${o.to===t.name?`<button onclick="act('respond',{year:st.year,id:'${o.id}',accept:true})">Accept</button>`:''}`:''}</p>`).join('')||'<p>No offers yet.</p>'}</section><section><h2>Maintenance & pollution control</h2><p>Uncontrolled operating industrial buildings pay $2M each in year 1 and $4M each thereafter. A clean retrofit costs $10M and reduces health risk as well as avoiding this simulated fine. Damaged buildings cannot operate until repaired ($12M).</p>${t.owned.filter(i=>i>=2&&i<=5).map(i=>`<p><b>${st.assets[i].n}</b> ${t.damaged.includes(i)?`<button onclick="act('repair',{year:st.year,i:${i}})">Repair $12M</button>`:' · Operational'} ${!t.clean.includes(i)?`<button class="alt" onclick="act('clean',{year:st.year,i:${i}})">Clean retrofit $10M</button>`:' · Clean retrofit installed'}</p>`).join('')||'<p>No industrial buildings yet.</p>'}</section>`}
function openUpgrade(i){upgradeId=i;upgradeDraft={a:['',''],text:''};render()}
function upgrades(t){let l=t.upgradeLessons?.find(x=>x.i===upgradeId);return `<section><div class="tag">Research & development</div><h2>Infrastructure upgrades</h2><p>Read the science briefing, answer two questions and submit a short explanation for teacher approval. Level 2 costs $12M; level 3 costs $18M. Upgrade each building at most once per year. Pollution controls are still required.</p>${t.upgradeFeedback?`<p class="reading">${esc(t.upgradeFeedback)}</p>`:''}${t.owned.map(i=>{let lv=t.levels?.[i]||1;return `<div class="upgrade-row"><b>${st.assets[i].icon} ${st.assets[i].n}</b><span class="level">LEVEL ${lv} / 3</span>${lv===3?'Maximum level':`<button class="alt" ${t.pending||t.damaged.includes(i)||t.upgraded?.includes(i)||t.cash<(lv===1?12:18)?'disabled':''} onclick="openUpgrade(${i})">Research level ${lv+1}</button>`}</div>`}).join('')||'<p>Build a facility first, then upgrade it in a later year.</p>'}${l&&!t.pending&&!t.upgraded?.includes(l.i)?`<div class="upgrade-form"><div class="tag">Level ${l.target} research licence · $${l.price}M</div><h3>${esc(l.title)}</h3><p class="reading">${esc(l.passage)}</p>${l.questions.map((q,j)=>`<label>${j+1}. ${esc(q.text)}<select id="upgradeq${j}" onchange="upgradeDraft.a[${j}]=this.value"><option value="">Select your answer</option>${q.options.map((o,k)=>`<option value="${k}" ${upgradeDraft.a[j]===String(k)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`).join('')}<label>3. ${esc(l.written)}<textarea id="upgradeText" maxlength="1000" oninput="upgradeDraft.text=this.value" placeholder="Explain using scientific evidence from the reading.">${esc(upgradeDraft.text)}</textarea></label><button onclick="act('upgrade',{year:st.year,i:upgradeId,answers:upgradeDraft.a.map(x=>x===''?-1:Number(x)),text:upgradeDraft.text})">Submit research</button> <button class="alt" onclick="upgradeId=null;render()">Close</button></div>`:''}</section>`}
function reviews(){return `<section><div class="tag">Teacher assessment</div><h2>Research licence requests · ${st.reviews.length}</h2>${st.reviews.map(r=>`<div class="review"><b>${esc(r.name)} · ${st.assets[r.i].n} · Level ${r.target}</b><p>${esc(r.prompt)}</p><p><b>Student response:</b> ${esc(r.text)}</p><p class="reading"><b>Marking guide:</b> ${esc(r.rubric)}</p><button onclick="act('review',{id:'${r.id}',approve:true})">Approve upgrade</button> <button class="alt" onclick="act('review',{id:'${r.id}',approve:false})">Request revision</button></div>`).join('')||'<p>No pending written responses.</p>'}</section>`}

function art(i,l=1,damaged=false){let colors=['#50a978','#e8a65c','#78a7c9','#8e9cb0','#54b6ad','#ab91d0','#e98c7d'],c=damaged?'#899399':colors[i];let h=25+l*8;return `<svg viewBox="0 0 110 86" aria-hidden="true"><path d="M8 69L58 48 105 68 56 84Z" fill="#729b76"/><path d="M21 62V${62-h}L56 ${48-h}V48Z" fill="${c}" stroke="#243f55"/><path d="M56 48V${48-h}L89 ${60-h}V60Z" fill="${c}" stroke="#243f55"/><path d="M21 ${62-h}L55 ${37-h} 89 ${60-h} 56 ${48-h}Z" fill="#e9eef0" stroke="#243f55"/><path d="M29 ${58-h}v12l11 -4v-12M65 ${47-h}v12l13 5v-12" fill="#c9f1ff" stroke="#527585"/><path d="M48 51v15l9 -4V47" fill="#334e5e"/>${l>1?`<rect x="77" y="${30-h/2}" width="8" height="20" fill="#485b6b"/>`:''}${damaged?'<path d="M38 20l8 12-6 8 10 9" stroke="#bd4038" stroke-width="4" fill="none"/>':''}<circle cx="12" cy="57" r="8" fill="#3d9e6e"/><circle cx="99" cy="58" r="7" fill="#3d9e6e"/></svg>`}
function hero(){return `<section class="hero"><div><div class="tag">YOUR MISSION · YEAR 9 SCIENCE</div><h2>Build a city.<br>Change the future.</h2><p>Trade resources, unlock science-powered upgrades and survive climate challenges. Can your team build the most sustainable city?</p><button onclick="document.getElementById('pin').focus();document.getElementById('pin').scrollIntoView({block:'center'})">Join your class ↓</button></div><svg viewBox="0 0 480 290" aria-label="Illustrated sustainable city"><rect width="480" height="290" rx="22" fill="#bce7f5"/><circle cx="392" cy="51" r="32" fill="#ffe69a"/><path d="M0 145Q95 53 190 130T480 105V290H0" fill="#82c6a0"/><path d="M0 205Q115 130 240 199T480 163V290H0" fill="#4aab82"/><path d="M0 248L250 174 480 236V290H0" fill="#d7e2d2"/><path d="M0 258L250 186 480 248" stroke="#fff" stroke-width="4" stroke-dasharray="15 11"/>${[0,1,2,3,4,5].map((i)=>`<g transform="translate(${18+i*73},${i%2?99:135}) scale(.93)">${art(i,2).replace('<svg viewBox="0 0 110 86" aria-hidden="true">','<g>').replace('</svg>','</g>')}</g>`).join('')}<g stroke="#f7fbff" stroke-width="5" stroke-linecap="round"><path d="M72 104V43m0 0l-25 10m25-10l15-25m-15 25l15 22M328 117V56m0 0l-25 10m25-10l15-25m-15 25l15 22"/></g><path d="M310 249l70-16 28 16-68 18z" fill="#285c91" stroke="#d7f4ff" stroke-width="2"/><path d="M333 244l28 15m-4-20l28 15" stroke="#d7f4ff"/></svg></section><div class="steps"><div><strong>01</strong><b>Build & trade</b>Choose facilities and exchange resources with classmates.</div><div><strong>02</strong><b>Research & upgrade</b>Read scientific evidence and unlock stronger technology.</div><div><strong>03</strong><b>Survive & thrive</b>Balance profit, ecosystems and public health.</div></div><h2 style="margin:24px 0 12px">Choose your role</h2>`}
function briefing(){let b=st.brief;return b?`<div class="briefing"><div class="mission">FIELD NOTES · READ BEFORE ANSWERING</div><h3>${esc(b.title)}</h3><p>${esc(b.reading)}</p><a href="${esc(b.source)}" target="_blank" rel="noopener noreferrer">Explore the source ↗</a></div>`:''}

function render(){let a=$('app');if(!session){a.innerHTML=hero()+`<div class="grid join-grid"><section><h2>Teacher</h2><p>Create a classroom room and share the PIN. Lead your teams through five years of change.</p><button onclick="act('create')">Host game</button></section><section><h2>Students</h2><label>Room PIN<input id="pin" inputmode="numeric" maxlength="6" placeholder="6 digits"></label><label>City name<input id="name" maxlength="32" placeholder="Your team name"></label><button onclick="act('join',{pin:$('pin').value.trim(),name:$('name').value})">Join my city →</button></section></div>`;return}if(!st){a.textContent='Connecting to your room…';return}let top=`<section><div class="actions"><b>ROOM ${st.pin} · ${st.host?'TEACHER':'STUDENT'}</b><button class="alt" onclick="if(confirm('Leave this session?'))leave()">Leave</button></div><h2>${st.phase==='lobby'?'Waiting lobby':st.phase==='finished'?'Game complete':'Year '+st.year+' of 5'}</h2></section>`,news=st.event?`<section><div class="tag">City news</div><h2>${st.event.t}</h2><p>${st.event.d}</p><small>${st.event.q}</small></section>`:'';if(st.host){let ready=st.teams.filter(t=>t.phase==='done').length;a.innerHTML=top+(st.phase==='lobby'?`<section><div class="tag">Join PIN</div><div class="pin">${st.pin}</div><p>${st.teams.length} cities connected. Students use this same website on their devices.</p><button ${st.teams.length?'':'disabled'} onclick="act('start')">Start game</button></section>`:st.phase==='playing'?news+`<section><h2>${ready} / ${st.teams.length} teams ready</h2><div class="actions"><button ${ready===st.teams.length?'':'disabled'} onclick="act('advance')">${st.year===5?'Reveal final results':'Start next year'}</button><button class="alt" onclick="if(confirm('End incomplete turns without further rewards?'))act('force')">Close incomplete turns</button></div></section>`:`<section><h2>Champion: ${esc(st.teams.find(t=>t.eligible)?.name||'No eligible city')}</h2><p>Discuss how the winning city balanced the 3Rs, economics and public health.</p></section>`)+(st.phase==='playing'?reviews():'')+leaderboard();return}let t=st.me;if(st.phase==='lobby'){a.innerHTML=top+`<section><h2>${esc(t.name)} is ready!</h2><p>Your teacher will start the game. Starting capital: $100M.</p></section>`;return}let stats=`<section><h2>${esc(t.name)}</h2><div class="stats">${[['Cash','$'+t.cash+'M'],['Sustainability',t.ep],['Public health',t.hp+'/100'],['Science',t.science+'/75']].map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><h3 style="margin-top:16px">Your city</h3><div class="city">${st.assets.map((x,i)=>`<span class="${t.owned.includes(i)?'':'empty'}">${art(i,t.levels?.[i]||1,t.damaged?.includes(i))}<small>${x.n}${t.owned.includes(i)?' · L'+(t.levels?.[i]||1):''}${t.damaged?.includes(i)?' · DAMAGED':t.clean?.includes(i)?' · CLEAN':''}</small></span>`).join('')}</div></section>`;let content='';if(st.phase==='finished'){content=`<section><h2>Final city score: ${st.teams.find(x=>x.name===t.name).score}</h2><p>${t.cash<0?'Outstanding debt: not eligible for championship.':'Eligible for championship.'} Total landfill: ${t.history.reduce((s,h)=>s+h.land,0)} units.</p><h3>Criterion D reflection</h3><p>Describe one technology used. Discuss an environmental benefit and a health risk. Explain how your city applied the 3Rs.</p><button onclick="window.print()">Print report</button></section>`+leaderboard()}else if(t.phase==='choose'){let cost=pick.reduce((s,i)=>s+st.assets[i].cost,0);content=upgrades(t)+market(t)+`<section><h2>Choose up to two investments</h2><p>Selected: ${pick.length}/2 · Remaining after purchase: $${Math.round((t.cash-cost)*10)/10}M</p><div class="grid">${st.assets.map((x,i)=>`<div class="tile ${t.owned.includes(i)?'owned':pick.includes(i)?'selected':''}"><div class="art">${art(i,t.levels?.[i]||1,t.damaged?.includes(i))}</div><small>${x.kind}</small><h3>${x.n}</h3><b>$${x.cost}M</b><p>${x.desc}</p><small>${x.cap}</small><button ${t.owned.includes(i)||(!pick.includes(i)&&(pick.length===2||cost+x.cost>t.cash))?'disabled':''} onclick="toggle(${i})">${t.owned.includes(i)?'Owned':pick.includes(i)?'Remove':'Invest'}</button></div>`).join('')}</div><p><button ${t.pending?'disabled':''} onclick="act('invest',{year:st.year,pick})">Run city &amp; lock investments</button></p></section>`}else{let h=t.history.at(-1);content=`<section><h2>Year results</h2><p>Managed ${h.managed} units · Landfill ${h.land} units · Revenue $${h.rev}M · Sustainability ${h.ep>=0?'+':''}${h.ep} · Health loss ${h.loss} · Pollution fine $${h.fine}M</p></section>`+(t.feedback?`<section id="feedback">${esc(t.feedback.text)}</section>`:'');if(t.phase==='quiz'){let q=t.question;content+=`<section class="question"><div class="tag">${q.crisis?'Science crisis · wrong answer costs 10 health':'Science challenge · first correct +5 points and $5M; retry +2 points'}</div><div class="progress" aria-label="Question progress">${[0,1,2].map(i=>`<span class="${i<=t.q?'done':''}"></span>`).join('')}</div><h2>Question ${t.q+1} of 3</h2>${briefing()}<p>${q.text}</p>${q.options.map((x,i)=>`<button class="alt" onclick="act('answer',{year:st.year,q:${t.q},attempt:${t.attempt},choice:${i}})">${x}</button>`).join('')}</section>`}else content+=`<section><h2>Ready for the next step</h2><p>Wait for your teacher. Discuss which investment you would make next and why.</p></section>`}a.innerHTML=top+stats+news+content;}
render();async function refresh(){if(session&&!busy&&!polling){polling=true;try{let d=await api('state');if(!busy&&session)update(d)}catch(e){showError(e)}finally{polling=false}}}refresh();setInterval(refresh,1500);
</script></html>
